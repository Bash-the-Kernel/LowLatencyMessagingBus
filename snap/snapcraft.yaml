name: low-latency-messaging-bus
version: '0.1'
summary: A low latency messaging bus for real-time trading applications.
description: |
  A lightweight, high-throughput, low-latency messaging bus using
  zero-copy shared memory and lock-free ring buffers, optimized
  for trading workloads.

base: core22
grade: stable
confinement: devmode

apps:
  benchmark:
    command: bin/benchmark

parts:
  low-latency-messaging-bus:
    source: .
    plugin: cmake
    build-packages:
      - build-essential
      - cmake
    override-build: |
      cmake $SNAPCRAFT_PART_SRC -DCMAKE_BUILD_TYPE=Release
      cmake --build . -- -j4
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp benchmark $SNAPCRAFT_PART_INSTALL/bin/